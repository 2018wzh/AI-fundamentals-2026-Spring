datasets:
  oil_etf:
    display_name: "OilETF-TimeMMD"
    panel_path: "REPLACE_WITH_ABSOLUTE_PATH_TO_MARKET_PANEL.parquet"
    sample_paths:
      H60_F1: "REPLACE_WITH_ABSOLUTE_PATH_TO_samples_H60_F1.parquet"
      H120_F5: "REPLACE_WITH_ABSOLUTE_PATH_TO_samples_H120_F5.parquet"
    date_column: "end_date"
    symbol_column: "symbol"
    price_columns:
      execution_price: "uso_open"
      mark_price: "uso_close"
      benchmark_price: "uso_close"
    prediction_result_paths:
      DLinear: "REPLACE_WITH_ABSOLUTE_PATH_TO_DLinear_predictions.parquet"
      PatchTST: "REPLACE_WITH_ABSOLUTE_PATH_TO_PatchTST_predictions.parquet"
      Chronos-2: "REPLACE_WITH_ABSOLUTE_PATH_TO_Chronos2_predictions.parquet"
    benchmark_symbols:
      - "USO"
      - "SPY"
  fnspid:
    display_name: "FNSPID"
    panel_path: "REPLACE_WITH_ABSOLUTE_PATH_TO_FNSPID_price_panel.parquet"
    sample_paths:
      H60_F1: "REPLACE_WITH_ABSOLUTE_PATH_TO_FNSPID_samples_H60_F1.parquet"
      H120_F5: "REPLACE_WITH_ABSOLUTE_PATH_TO_FNSPID_samples_H120_F5.parquet"
    date_column: "end_date"
    symbol_column: "symbol"
    price_columns:
      execution_price: "open"
      mark_price: "close"
      benchmark_price: "close"
    prediction_result_paths:
      DLinear: "REPLACE_WITH_ABSOLUTE_PATH_TO_FNSPID_DLinear_predictions.parquet"
      Chronos-2: "REPLACE_WITH_ABSOLUTE_PATH_TO_FNSPID_Chronos2_predictions.parquet"
    benchmark_symbols:
      - "SPY"
  oil_etf_intraday:
    display_name: "OilETF-Intraday (Hourly)"
    panel_path: "REPLACE_WITH_ABSOLUTE_PATH_TO_hourly_panel.parquet"
    sample_paths:
      H60_F1: "REPLACE_WITH_ABSOLUTE_PATH_TO_intraday_samples_H60_F1.parquet"
      H120_F7: "REPLACE_WITH_ABSOLUTE_PATH_TO_intraday_samples_H120_F7.parquet"
    date_column: "end_date"
    symbol_column: "symbol"
    price_columns:
      execution_price: "open"
      mark_price: "close"
      benchmark_price: "close"
    prediction_result_paths:
      Chronos-2: "REPLACE_WITH_ABSOLUTE_PATH_TO_Chronos2_intraday_predictions.parquet"
      Chronos-2-ECHO: "REPLACE_WITH_ABSOLUTE_PATH_TO_Chronos2ECHO_intraday_predictions.parquet"
    benchmark_symbols:
      - "USO"
